<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="taBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="cyberSprout" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#6ee7b7" />
    </linearGradient>
    <linearGradient id="goldAura" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="botMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="glowG" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="megaGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="600" rx="40" fill="url(#taBg)" />
  <circle cx="300" cy="300" r="230" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.3" />
  <circle cx="300" cy="300" r="260" fill="none" stroke="#10b981" stroke-width="1" opacity="0.2" />

  <!-- Orbiting Rune Glyphs -->
  <g filter="url(#glowG)" opacity="0.8">
    <circle cx="150" cy="180" r="6" fill="#6ee7b7" />
    <circle cx="450" cy="180" r="6" fill="#38bdf8" />
    <circle cx="120" cy="360" r="8" fill="#fef08a" />
    <circle cx="480" cy="360" r="8" fill="#6ee7b7" />
  </g>

  <!-- Body / Floating Asgardian Pod -->
  <ellipse cx="300" cy="460" rx="140" ry="25" fill="#06b6d4" opacity="0.25" filter="url(#megaGlow)" />
  
  <!-- Robot/Companion Torso -->
  <path d="M 210 420 C 210 350, 390 350, 390 420 C 390 470, 210 470, 210 420 Z" fill="url(#botMetal)" stroke="#38bdf8" stroke-width="3" />
  <!-- Torso Heart Reactor (Sprout Core) -->
  <circle cx="300" cy="415" r="24" fill="#022c22" stroke="#10b981" stroke-width="2.5" />
  <circle cx="300" cy="415" r="14" fill="#34d399" filter="url(#glowG)" />

  <!-- Floating Head / Sphere -->
  <circle cx="300" cy="270" r="115" fill="#0f172a" stroke="url(#goldAura)" stroke-width="4" />
  <circle cx="300" cy="270" r="105" fill="#1e293b" />

  <!-- Visor / Face Screen -->
  <rect x="220" y="215" width="160" height="100" rx="40" fill="#030712" stroke="#38bdf8" stroke-width="2" />
  
  <!-- Friendly Glowing Eyes -->
  <ellipse cx="265" cy="265" rx="16" ry="18" fill="#34d399" filter="url(#glowG)" />
  <ellipse cx="268" cy="262" rx="5" ry="6" fill="#ffffff" />
  <ellipse cx="335" cy="265" rx="16" ry="18" fill="#34d399" filter="url(#glowG)" />
  <ellipse cx="338" cy="262" rx="5" ry="6" fill="#ffffff" />

  <!-- Cheerful Smile -->
  <path d="M 285 288 Q 300 302 315 288" stroke="#38bdf8" stroke-width="3.5" fill="none" stroke-linecap="round" filter="url(#glowG)" />

  <!-- Golden Asgardian Rune Circlet Headpiece -->
  <path d="M 200 230 C 240 180, 360 180, 400 230" fill="none" stroke="url(#goldAura)" stroke-width="6" stroke-linecap="round" />
  <polygon points="300,165 315,185 300,205 285,185" fill="url(#goldAura)" stroke="#fef08a" stroke-width="2" filter="url(#glowG)" />

  <!-- The Legendary Sprout on Top (TA Junior's Signature) -->
  <g filter="url(#glowG)">
    <!-- Stem -->
    <path d="M 300 165 C 300 120, 290 90, 300 65" stroke="#34d399" stroke-width="6" fill="none" stroke-linecap="round" />
    <!-- Left Leaf -->
    <path d="M 300 85 C 240 60, 235 110, 298 92 Z" fill="url(#cyberSprout)" stroke="#a7f3d0" stroke-width="2" />
    <!-- Right Leaf -->
    <path d="M 300 70 C 360 45, 365 95, 302 78 Z" fill="url(#cyberSprout)" stroke="#a7f3d0" stroke-width="2" />
    <circle cx="300" cy="55" r="8" fill="#fef08a" filter="url(#glowG)" />
  </g>

  <!-- Left Floating Ear Antenna -->
  <rect x="175" y="245" width="16" height="50" rx="8" fill="#38bdf8" stroke="#1d4ed8" stroke-width="2" filter="url(#glowG)" />
  <!-- Right Floating Ear Antenna -->
  <rect x="409" y="245" width="16" height="50" rx="8" fill="#38bdf8" stroke="#1d4ed8" stroke-width="2" filter="url(#glowG)" />

  <!-- Badge Label -->
  <rect x="180" y="525" width="240" height="42" rx="21" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
  <text x="300" y="552" font-family="'Outfit', 'Inter', sans-serif" font-weight="700" font-size="18" fill="#38bdf8" text-anchor="middle" letter-spacing="2">ODIN FORCE • ASGARDIAN GUIDE</text>
</svg>
